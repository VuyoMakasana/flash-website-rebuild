    <link rel="icon" type="image/png" href="/brand/flash-logo.png" />

    <title>FLASH — Same-Day Clothing Delivery | Port Elizabeth, South Africa</title>
    <meta name="description" content="FLASH is a same-day clothing delivery platform launching in Gqeberha, Port Elizabeth. Local sellers, local drivers, delivered today. Coming soon." />
    <meta name="keywords" content="FLASH, same-day delivery, clothing delivery, Port Elizabeth, Gqeberha, South Africa, fashion delivery" />
    <!-- homepage-only:start
         Everything up to homepage-only:end is served at / only. The build
         writes shell.html (this file minus this block) and vercel.json
         serves it for every other route, so no other page claims the
         homepage's canonical or structured data. usePageMeta keeps
         canonical / og:url / twitter:url correct per route at runtime. -->
    <link rel="canonical" href="https://flashdelivery.co.za/" />
    <meta property="og:url" content="https://flashdelivery.co.za/" />
    <meta name="twitter:url" content="https://flashdelivery.co.za/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://flashdelivery.co.za/#organization",
        "name": "Flash",
        "alternateName": "Flash Delivery",
        "description": "Same-day clothing delivery for local boutiques in Gqeberha.",
        "url": "https://flashdelivery.co.za/",
        "logo": "https://flashdelivery.co.za/brand/flash-logo.png",
        "areaServed": [
          { "@type": "City", "name": "Gqeberha" },
          { "@type": "AdministrativeArea", "name": "Nelson Mandela Bay" }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://flashdelivery.co.za/#founder",
        "name": "Vuyo Makasana",
        "jobTitle": "Founder & CEO",
        "worksFor": { "@type": "Organization", "@id": "https://flashdelivery.co.za/#organization", "name": "Flash" },
        "sameAs": ["https://www.linkedin.com/in/vuyo-makasana-936bb142b"],
        "homeLocation": { "@type": "City", "name": "Gqeberha" }
      }
    </script>
    <!-- homepage-only:end -->
